[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stardew"
version = "3.0.0"
description = "Shared save analysis, progress, predictions and maps for Stardew Valley"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["lxml>=5,<7", "xxhash>=3,<5"]

[project.urls]
Repository = "https://github.com/lsiddd/stardew-compass"
Documentation = "https://github.com/lsiddd/stardew-compass#readme"
Issues = "https://github.com/lsiddd/stardew-compass/issues"

[project.optional-dependencies]
plot = ["Pillow>=10.1"]
test = ["pytest>=8", "Pillow>=10.1", "build>=1.2"]

[project.scripts]
stardew = "stardew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stardew*"]

[tool.setuptools.package-data]
"stardew" = ["py.typed"]
"stardew.resources" = ["*.json", "*.txt", "catalogs/*.json", "fonts/*.ttf", "fonts/*.txt"]
"stardew.infrastructure.xnb" = ["schemas.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
