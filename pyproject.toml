[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stardew-report"
version = "2.0.0"
description = "Native Python Stardew Valley progress and RNG reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["lxml>=5,<7", "cssselect>=1.2,<2", "html5lib>=1.1,<2", "xxhash>=3,<5"]

[project.scripts]
stardew-report = "stardew_report.cli:main"

[tool.setuptools.packages.find]
include = ["stardew_report*"]

[tool.setuptools.package-data]
stardew_report = ["data/*.json", "data/*.html", "data/*.txt"]
