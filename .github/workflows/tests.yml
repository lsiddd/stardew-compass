name: tests
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra test --extra dev
      - run: uv run --no-sync ruff check src tests benchmarks scripts
      - run: uv run --no-sync ruff format --check src tests benchmarks scripts
      - run: uv run --no-sync mypy
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra test
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python -m build
      - name: Verify installed wheel outside checkout
        run: uv run --no-sync python scripts/verify_wheel.py
